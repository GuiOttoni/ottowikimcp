apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpserver
  namespace: ottowikimcp
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcpserver }
  template:
    metadata:
      labels: { app: mcpserver }
    spec:
      containers:
        - name: mcpserver
          image: ottowikimcp-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: WorkApi__BaseUrl
              value: http://workapi:8080
            # A wiki fake já vem empacotada na imagem (ver Dockerfile) — Wiki__RepoUrl
            # já aponta pra ela por padrão. Pra usar a wiki real do Azure DevOps depois,
            # troque só esta variável (nenhum código muda):
            # - name: Wiki__RepoUrl
            #   value: https://dev.azure.com/{org}/{project}/_git/{project}.wiki
          resources:
            requests: { cpu: "10m", memory: "64Mi" }
            limits: { cpu: "300m", memory: "192Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcpserver
  namespace: ottowikimcp
spec:
  type: NodePort
  selector: { app: mcpserver }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30880
