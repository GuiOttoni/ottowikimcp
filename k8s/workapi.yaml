apiVersion: apps/v1
kind: Deployment
metadata:
  name: workapi
  namespace: ottowikimcp
spec:
  replicas: 1
  selector:
    matchLabels: { app: workapi }
  template:
    metadata:
      labels: { app: workapi }
    spec:
      containers:
        - name: workapi
          image: docker.io/guiottoni/ottowikimcp-workapi:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            # Carrega em memória um índice de busca de fundos reais (~34 mil registros, ~8MB de
            # JSON) — 128Mi estourava OutOfMemoryException nesse carregamento. 256Mi dá folga.
            requests: { cpu: "10m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: workapi
  namespace: ottowikimcp
spec:
  selector: { app: workapi }
  ports:
    - port: 8080
      targetPort: 8080
